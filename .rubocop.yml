AllCops:
  TargetRubyVersion: 3.4  # RuboCop 1.74 max; project runs on Ruby 4.0.1
  NewCops: disable
  Include:
    - 'lib/frozone/**/*.rb'
    - 'spec/**/*.rb'
  Exclude:
    - 'lib/core/**/*.rb'
    - 'vendor/**/*'

# ── Layout ────────────────────────────────────────────────────────────────────

Layout/EmptyLines:
  # No consecutive blank lines
  Enabled: true

Layout/EmptyLineBetweenDefs:
  Enabled: true
  EmptyLineBetweenMethodDefs: true
  EmptyLineBetweenClassDefs: true
  EmptyLineBetweenModuleDefs: true
  # Allow adjacent single-line defs without blank lines between them
  AllowAdjacentOneLineDefs: true

Layout/TrailingWhitespace:
  Enabled: true

Layout/TrailingEmptyLines:
  Enabled: true

# Column-aligned assignments are intentional style — don't flag extra spaces
Layout/ExtraSpacing:
  Enabled: false

Layout/LineLength:
  Enabled: false

Layout/EmptyLineAfterGuardClause:
  Enabled: false

Layout/EmptyLinesAroundAttributeAccessor:
  Enabled: false

# ── Metrics (all disabled) ────────────────────────────────────────────────────

Metrics/MethodLength:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/ModuleLength:
  Enabled: false

Metrics/BlockLength:
  Enabled: false

Metrics/BlockNesting:
  Enabled: false

Metrics/AbcSize:
  Enabled: false

Metrics/CyclomaticComplexity:
  Enabled: false

Metrics/PerceivedComplexity:
  Enabled: false

Metrics/ParameterLists:
  Enabled: false

# ── Naming ────────────────────────────────────────────────────────────────────

# Short names like v, n, k are idiomatic in this codebase
Naming/MethodParameterName:
  Enabled: false

# `v` is fine for binary operator params
Naming/BinaryOperatorParameterName:
  Enabled: false

# SCREAMING_SNAKE_CASE not always appropriate for VM constants
Naming/ConstantName:
  Enabled: false

Naming/VariableNumber:
  Enabled: false

Naming/PredicateName:
  Enabled: false

# ── Style (personal taste — mostly disabled) ──────────────────────────────────

Style/FrozenStringLiteralComment:
  Enabled: false

Style/StringLiterals:
  Enabled: false

Style/StringLiteralsInInterpolation:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/SingleLineMethods:
  Enabled: false

Style/Semicolon:
  Enabled: false

Style/TrailingCommaInArguments:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  Enabled: false

Style/TrailingCommaInHashLiteral:
  Enabled: false

Style/GuardClause:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/AndOr:
  Enabled: false

Style/MultilineBlockChain:
  Enabled: false

Style/Lambda:
  Enabled: false

Style/NumericPredicate:
  Enabled: false

Style/ZeroLengthPredicate:
  Enabled: false

Style/NegatedIf:
  Enabled: false

Style/InverseMethods:
  Enabled: false

# We use `def foo = @foo` rather than attr_reader
Style/TrivialAccessors:
  Enabled: false

Style/AccessorGrouping:
  Enabled: false

# {} vs do/end is a taste preference here
Style/BlockDelimiters:
  Enabled: false

Style/CommentAnnotation:
  Enabled: false

Style/IdenticalConditionalBranches:
  Enabled: false

Style/TernaryParentheses:
  Enabled: false

Style/NestedTernaryOperator:
  Enabled: false

Style/MultilineTernaryOperator:
  Enabled: false

Style/RescueModifier:
  Enabled: false

Style/RescueStandardError:
  Enabled: false

Style/MutableConstant:
  Enabled: false

Style/ClassVars:
  Enabled: false

Style/HashEachMethods:
  Enabled: false

Style/OptionalBooleanParameter:
  Enabled: false

Style/RedundantParentheses:
  Enabled: false

Style/RedundantBegin:
  Enabled: false

Style/EmptyElse:
  Enabled: false

Style/IfInsideElse:
  Enabled: false

Style/NonNilCheck:
  Enabled: false

Style/SafeNavigation:
  Enabled: false

Style/MultipleComparison:
  Enabled: false

Style/SoleNestedConditional:
  Enabled: false

Style/CaseLikeIf:
  Enabled: false

Style/SymbolArray:
  Enabled: false

Style/RedundantReturn:
  Enabled: false

Style/RedundantSelf:
  Enabled: false

Style/RedundantInterpolation:
  Enabled: false

Style/HashTransformKeys:
  Enabled: false

Style/MultilineIfModifier:
  Enabled: false

Style/ColonMethodCall:
  Enabled: false

Style/StderrPuts:
  Enabled: false

Style/SelfAssignment:
  Enabled: false

Style/BlockComments:
  Enabled: false

# ── Lint ──────────────────────────────────────────────────────────────────────

Lint/UnusedMethodArgument:
  Enabled: false

Lint/UnusedBlockArgument:
  Enabled: false

# VM objects intentionally skip super in initialize
Lint/MissingSuper:
  Enabled: false

Lint/HashCompareByIdentity:
  Enabled: false

Lint/RedundantSafeNavigation:
  Enabled: false

Lint/BooleanSymbol:
  Enabled: false

Lint/InterpolationCheck:
  Enabled: false
